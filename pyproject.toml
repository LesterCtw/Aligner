[project]
name = "aligner"
version = "0.1.0"
description = "FIB serial slice preview alignment tool."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "PySide6>=6.7",
    "scipy>=1.12",
    "tifffile>=2024.8.30",
    "vtk>=9.6.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
aligner = "aligner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aligner"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

